<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Listado de
Comunidades Autónomas')"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
    <h1>Regiones</h1>

    <div th:replace="region-filter :: regionFilter(${search}, ${sort}, ${currentPage})"></div>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Muestra la lista de regiones en una tabla -->
    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Imagen</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="region : ${listRegions}">
            <td th:text="${region.id}"></td>
            <td th:text="${region.code}"></td>
            <td th:text="${region.name}"></td>
            <!-- Mostrar la imagen si existe -->
            <td>
                <img th:if="${region.image != null}"
                     th:src="@{'/uploads/' + ${region.image}}"
                     alt="Imagen de la region"
                     style="width: 100px; height: 100px; object-fit: cover;" />
                <!-- Mostrar este texto si no existe la imagen -->
                <span th:if="${region.image == null}" th:text="#{msg.region.noImage}"></span>
            </td>
            <td>
                <!-- Botón para editar -->
                <a th:href="@{/regions/edit(id=${region.id})}" class="btn btn-primary btn-sm">Edit</a>
                <!-- Botón para eliminar -->
                <form th:action="@{/regions/delete}" method="post" class="d-inline">
                    <input type="hidden" name="id" th:value="${region.id}"/>
                    <button type="submit" class="btn btn-danger btn-sm" th:onclick="|return confirm('Are you sure you wantto delete this region?');|">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Sección de paginación -->
    <nav aria-label="Page navigation" class="mt-4" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">

            <!-- Botón "Anterior" -->
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a aria-label="Previous"
                   class="page-link"
                   th:href="${#strings.isEmpty(search)} ? @{/regions(page=${currentPage - 1}, sort=${sort})} :  @{/regions(page=${currentPage - 1}, search=${search}, sort=${sort})}">&laquo;</a>
            </li>

            <!-- Números de página -->
            <li class="page-item" th:classappend="${i == currentPage} ? 'active'"
                th:each="i : ${#numbers.sequence(1, totalPages)}">
                <a class="page-link"
                   th:href="${#strings.isEmpty(search)} ? @{/regions(page=${i}, sort=${sort})} :  @{/regions(page=${i}, search=${search}, sort=${sort})}"
                   th:text="${i}"></a>
            </li>

            <!-- Botón "Siguiente" -->
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a aria-label="Next" class="page-link"
                   th:href="${#strings.isEmpty(search)} ? @{/regions(page=${currentPage + 1}, sort=${sort})} :  @{/regions(page=${currentPage + 1}, search=${search}, sort=${sort})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <!-- Botón para añadir una nueva región -->
    <a th:href="@{/regions/new}" class="btn btn-success mt-3">Add New Region</a>

    <!-- Volver a la página principal -->
    <a href="#" th:href="@{/}" class="btn btn-secondary mt-3">Back to Home</a>
</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
