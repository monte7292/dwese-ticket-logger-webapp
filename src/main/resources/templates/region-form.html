<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Insertar/Actualizar
Comunidad Autónoma')"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
    <h1 th:text="${region.id == null ? 'Add New Region' : 'Edit Region'}"></h1>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Mostrar un mensaje de error si existe -->
    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <form th:action="${region.id == null} ? @{/regions/insert} : @{/regions/update}"
          th:object="${region}" method="post" class="mt-4" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="code" class="form-label">Code:</label>
            <input type="text" th:field="*{code}" id="code" class="form-control" />
            <div th:if="${#fields.hasErrors('code')}" class="text-danger" th:errors="*{code}"></div>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" />
            <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <!-- Label siempre visible -->
            <label for="imageFile" class="form-label" th:text="#{msg.regionform.image}"></label>

            <!-- Validaciones si hay imagen-->
            <div th:if="${region.id != null and region.image != null}" class="alert alert-warning mb-2">
                Ya existe una imagen
            </div>
            <div th:if="${region.id != null and region.image != null}" class="mb-2">
                <!-- Imagen -->
                <div>
                    <img th:src="@{'/uploads/' + ${region.image}}" alt="Imagen de la region" style="width: 100px; height: 100px; object-fit: cover;" />
                </div>

                <!-- Botón para eliminar -->
                <div>
                <form th:action="region" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm" th:onclick="|return confirm('Are you sure you want to delete this image?');|">
                        Borrar imagen
                    </button>
                </form>
                </div>
            </div>

            <!-- Si NO existe imagen -->
            <!-- Enseñamos el boton para añadir la imagen    -->
            <div th:if="${region.image == null}" class="mb-2">
                <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*"/>
            </div>

        </div>

        <button type="submit" class="btn btn-primary" th:text="${region.id ==null ? 'Create' : 'Update'}"></button>
    </form>

    <!-- Volver a la lista de regiones -->
    <a href="#" th:href="@{/regions}" class="btn btn-secondary mt-3">Back to
        List</a>
</main>


</body>
</html>
