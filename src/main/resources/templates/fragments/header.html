<!-- header.html -->
<header th:fragment="header" xmlns:th="http://www.w3.org/1999/xhtml"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="/">Login</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">

                <!-- Menú principal -->
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/regions}">Regiones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/provinces}">Provincias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets}">Tickets</a>
                    </li>
                </ul>

                <!-- SELECTOR DE IDIOMA (solo cuando está autenticado) -->
                <form sec:authorize="isAuthenticated()" th:action="@{/}" method="get"
                      class="d-flex me-3">
                    <select name="lang" onchange="this.form.submit()" class="form-select form-select-sm">
                        <option value="es" th:selected="${#locale.language == 'es'}">🇪🇸 Español</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">🇬🇧 English</option>
                    </select>
                </form>

                <!-- Texto de usuario logueado -->
                <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                    <li class="nav-item d-flex align-items-center">
                        <span class="navbar-text me-2">Bienvenido,</span>
                        <span class="navbar-text fw-bold" sec:authentication="name"></span>
                    </li>
                </ul>

                <!-- Login / Logout -->
                <ul class="navbar-nav ms-3 mb-2 mb-md-0">

                    <!-- Login si NO autenticado -->
                    <li class="nav-item d-flex align-items-center" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}" th:text="#{spring.security.ui.login.title}">Login</a>
                        <span class="text-white-50 mx-1">|</span>
                        <a class="nav-link" th:href="@{/register}" th:text="#{msg.register.submit}">Register</a>
                    </li>

                    <!-- Logout si autenticado -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="#"
                           onclick="event.preventDefault();
                           document.getElementById('logout-form').submit();">
                            Logout
                        </a>
                        <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
                    </li>

                </ul>

                <!-- SELECTOR DE IDIOMA (solo cuando NO está autenticado) -->
                <form sec:authorize="!isAuthenticated()" th:action="@{/}" method="get"
                      class="d-flex ms-3">
                    <select name="lang" onchange="this.form.submit()" class="form-select form-select-sm">
                        <option value="es" th:selected="${#locale.language == 'es'}">🇪🇸 Español</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">🇬🇧 English</option>
                    </select>
                </form>

            </div>
        </div>
    </nav>

</header>
