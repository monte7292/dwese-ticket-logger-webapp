<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Login')"></head>
<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="flex-shrink-0 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h1 class="mt-5 mb-4" th:text="#{spring.security.ui.login.title}">Login</h1>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <!-- MENSAJE DE ERROR GENERAL -->
                <div th:if="${param.error}" class="alert alert-danger text-center">
                    Usuario o contraseña incorrectos
                </div>

                <!-- MENSAJE DE REGISTRO EXITOSO -->
                <div th:if="${param.registered}" class="alert alert-success text-center">
                    <span th:text="#{msg.login.registered}">Registro completado con éxito. Por favor, inicie sesión.</span>
                </div>

                <form th:action="@{/login}" method="post" class="form-signin">

                    <!-- USERNAME -->
                    <div class="form-floating mb-3">
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               th:classappend="${param.error} ? 'is-invalid' : ''"
                               th:placeholder="#{spring.security.ui.login.username}"
                               required autofocus>
                        <label for="username" th:text="#{spring.security.ui.login.username}">Usuario</label>

                        <div class="invalid-feedback">
                            Usuario incorrecto
                        </div>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-floating mb-3">
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               th:classappend="${param.error} ? 'is-invalid' : ''"
                               th:placeholder="#{spring.security.ui.login.password}"
                               required>
                        <label for="password" th:text="#{spring.security.ui.login.password}">Contraseña</label>

                        <div class="invalid-feedback">
                            Contraseña incorrecta
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100" type="submit"
                            th:text="#{spring.security.ui.login.submit}">
                        Entrar
                    </button>
                </form>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="mx-2 text-muted small text-uppercase">O entra con</span>
                    <hr class="flex-grow-1">
                </div>

                <a href="/oauth2/authorization/github" class="btn btn-dark btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-github"></i>
                    <span>GitHub</span>
                </a>

                <div class="text-center mt-3">
                    <a th:href="@{/register}" th:text="#{msg.login.registerLink}">¿No tienes cuenta? Regístrate aquí</a>
                </div>

            </div>
        </div>
    </div>
</main>
</body>
</html>
